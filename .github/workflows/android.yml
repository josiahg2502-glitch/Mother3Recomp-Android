name: Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "dependencies.lock.json"
      - "patches/**"
      - "tests/**"
      - "tools/setup_deps.py"
      - "tools/check_android_package.py"
      - "CMakeLists.txt"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/**"
      - "variants/**"
      - "gbarecomp"
      - "recomp-ui"
      - "dependencies.lock.json"
      - "patches/**"
      - "tests/**"
      - "tools/setup_deps.py"
      - "tools/check_android_package.py"
      - "CMakeLists.txt"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      variant:
        description: "MOTHER 3 variant"
        required: true
        default: "en"
        type: choice
        options:
          - en
          - jpn

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MOTHER3_VARIANT: ${{ inputs.variant || 'en' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare pinned runtime dependencies
        run: python3 tools/setup_deps.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android native toolchain
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          validate-wrappers: false

      - name: Build bootstrap test APK
        working-directory: android
        run: |
          gradle :app:assembleRelease \
            -Pmother3Variant="${MOTHER3_VARIANT}" \
            -PgbaAbis=arm64-v8a \
            -PgbaNativeJobs=2 \
            --stacktrace

      - name: Check setup and package paths
        run: |
          python3 -m unittest discover -s tests -p test_android_packaging.py
          MANIFEST="$(find android/app/build/intermediates/merged_manifests -path '*release*' -name AndroidManifest.xml | head -n 1)"
          python3 tools/check_android_package.py android/app/build/outputs/apk/release/app-release.apk "$MANIFEST"

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/Mother3Recomp-${MOTHER3_VARIANT}-android-arm64-bootstrap-test.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mother3Recomp-${{ env.MOTHER3_VARIANT }}-android-arm64-bootstrap-test
          path: out/*.apk
          if-no-files-found: error
